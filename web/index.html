</style></head><body><aside><div class="brand">◉ CHICKEN<span> FUTSAL</span></div><div class="brand-sub">AMICI. RIVALI. OGNI SETTIMANA.</div><nav id="nav"></nav><div class="sidebar-bottom">IL NOSTRO CAMPIONATO<br><b style="color:white">Stagione 2026</b><br><br>Il giovedì non si prendono impegni.</div></aside><main><header class="top"><div><div class="mobile-logo">◉ CHICKEN FUTSAL</div><span class="caption">Il calcetto, fatto bene.</span><br><small>Stagione 2026 · Il nostro gruppo</small></div><div class="identity"><small>Prova l’app come</small><select id="identity" aria-label="Identità dimostrativa"></select></div></header><div id="app"></div><footer>Prototipo interattivo · Dati salvati su questo browser · Notifiche e permessi simulati</footer></main><dialog id="modal"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const names=['Marco Rossi','Luca Bianchi','Andrea Costa','Davide Moretti','Matteo Riva','Alessandro Greco','Simone Conti','Federico Galli','Francesco Villa','Gabriele Romano','Paolo Ferri','Nicola Bruno'];
const labels=['Velocità','Tiro','Passaggio','Dribbling','Difesa','Fisico'];
const seed={players:names.map((name,id)=>({id,name,role:['Attaccante','Regista','Difensore','Portiere'][id%4],admin:id===0,seeAll:id<3,goals:[32,27,14,0,21,18,8,2,17,11,5,9][id],own:[1,0,3,1,2,4,1,0,2,1,5,2][id],apps:[24,23,22,25,20,19,24,21,18,22,17,20][id],ratings:[78-id%5*3,85-id*2,80-id%4*5,82-id%6*4,58+id*3,74+id%3*5]})),matches:[{id:1,date:'2026-10-08',time:'21:00',field:'Centro Sportivo Jumbo',a:[0,3,4,7,8],b:[1,2,5,6,9],done:false}],votes:{},voteOpen:true,notifications:[]};
let state;try{state=JSON.parse(localStorage.getItem('pollone-v1'))||structuredClone(seed)}catch{state=structuredClone(seed)}let user=0,page='home',search='',sort='goals';
const $=s=>document.querySelector(s),p=id=>state.players.find(x=>x.id===+id)||{id:+id,name:'Giocatore eliminato',role:'',admin:false,seeAll:false,ratings:[0,0,0,0,0,0],goals:0,own:0,apps:0},me=()=>p(user),admin=()=>me().admin,canSee=x=>admin()||me().seeAll||x.id===user;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('pollone-v1',JSON.stringify(state))}function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,4000)}
const initial=x=>x.name.split(' ').map(s=>s[0]).join('');const overall=x=>Math.round(x.ratings.reduce((a,b)=>a+b,0)/6);const avatar=x=>`<div class="avatar">${initial(x)}</div>`;const opts=()=>state.players.map(x=>`<option value="${x.id}">${esc(x.name)}${x.id===user?' (tu)':''}</option>`).join('');
const date=d=>new Date(d+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
function radar(x){let point=(i,r)=>[140+Math.sin(i*Math.PI/3)*r,106-Math.cos(i*Math.PI/3)*r].join(',');return `<svg class="radar" viewBox="0 0 280 220" role="img" aria-label="Esagono delle sei valutazioni di ${esc(x.name)}">${[.25,.5,.75,1].map(r=>`<polygon points="${labels.map((_,i)=>point(i,70*r)).join(' ')}" fill="none" stroke="#dae2d4"/>`).join('')}${labels.map((_,i)=>`<line x1="140" y1="106" x2="${point(i,70).split(',')[0]}" y2="${point(i,70).split(',')[1]}" stroke="#e3e9de"/>`).join('')}<polygon points="${x.ratings.map((r,i)=>point(i,70*r/99)).join(' ')}" fill="#a9d45a55" stroke="#32644a" stroke-width="2"/>${labels.map((l,i)=>`<text x="${point(i,96).split(',')[0]}" y="${+point(i,96).split(',')[1]+4}" text-anchor="middle" font-size="10" fill="#62766b">${l} ${x.ratings[i]}</text>`).join('')}</svg>`}
function heading(title,sub,action=''){return `<div class="heading"><div><h1>${title}</h1><p class="muted" style="margin:0">${sub}</p></div>${action}</div>`}
function pitch(m){return `<div class="pitch" aria-label="Formazioni"><div class="teamline">${m.a.map(id=>`<div><div class="shirt">${initial(p(id))}</div><div class="pitch-name">${p(id).name.split(' ')[0]}</div></div>`).join('')}</div><div class="teamline">${m.b.map(id=>`<div><div class="shirt blue">${initial(p(id))}</div><div class="pitch-name">${p(id).name.split(' ')[0]}</div></div>`).join('')}</div></div>`}
function leaders(key){return state.players.filter(canSee).sort((a,b)=>b[key]-a[key]).slice(0,3).map((x,i)=>`<div class="row leader"><span class="rank">0${i+1}</span>${avatar(x)}<div style="flex:1"><strong>${esc(x.name)}</strong><small>${esc(x.role)}</small></div><span class="score">${x[key]}</span></div>`).join('')}
function home(){let m=state.matches.filter(x=>!x.done&&!x.cancelled).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0],x=me();return heading(`Ci vediamo in campo, ${x.name.split(' ')[0]}.`,'La tua squadra. Le tue partite. Le nostre solite sfide.',admin()?'<button class="btn" onclick="newMatch()">＋ Nuova partita</button>':'')+(m?`<section class="hero"><div><span class="pill">PROSSIMA PARTITA · 5 CONTRO 5</span><h2>${date(m.date)}</h2><p class="muted">◷ ${m.time} &nbsp; · &nbsp; ${esc(m.field)}</p><div class="row"><span class="pill">10 convocati</span><span class="pill">${[...m.a,...m.b].includes(user)?'Sei in campo ✓':'Non convocato'}</span></div><div class="hero-actions"><button class="btn lime" onclick="showMatch(${m.id})">Vedi formazioni ↗</button><button class="btn secondary" onclick="downloadCalendar(${m.id})">Calendario</button></div></div>${pitch(m)}</section>`:'<div class="card empty">Nessuna partita in programma. Il campo vi aspetta.</div>')+`<div class="metrics"><div class="metric"><small>I TUOI GOL</small><strong>${x.goals}</strong><small>Verso la Scarpa d’oro</small></div><div class="metric"><small>LE TUE PRESENZE</small><strong>${x.apps}</strong><small>Il campo chiama</small></div><div class="metric"><small>I TUOI AUTOGOL</small><strong>${x.own}</strong><small>Capita anche ai migliori</small></div><div class="metric"><small>IL TUO LIVELLO</small><strong>${overall(x)}<span style="font-size:14px;color:#8f9e89"> / 99</span></strong><small>Valutazione degli admin</small></div></div><div class="section-title"><h2>La corsa ai premi</h2><button class="link" onclick="go('awards')">Tutti i premi →</button></div><div class="grid"><div class="card"><span class="caption muted">👟 Scarpa d’oro</span>${leaders('goals')}</div><div class="card"><span class="caption muted">🏅 Pollari</span>${leaders('apps')}</div><div class="card" style="background:#e9efdc"><span class="caption">IL VERDETTO È VOSTRO</span><h2 style="margin-top:20px">Talento o bidone?</h2><p class="muted">Un anno di giocate. Un voto segreto. Decidi chi merita il Pollone e il Bidone d’oro.</p><button class="btn" onclick="go('votes')">${state.votes[user]?'Voto già inviato ✓':'Vai alle votazioni →'}</button></div></div>${!admin()&&!me().seeAll?'<div class="notice">Le classifiche mostrano solo i tuoi dati. L’admin può autorizzarti a vedere le statistiche del gruppo.</div>':''}`}
function players(){let list=state.players.filter(x=>x.name.toLowerCase().includes(search.toLowerCase()));return heading('La rosa','Gli amici di sempre. Qualche fenomeno, molti polmoni.',admin()?'<button class="btn" onclick="addPlayer()">＋ Giocatore</button>':'')+`<div class="toolbar"><input aria-label="Cerca giocatore" placeholder="Cerca un giocatore…" value="${esc(search)}" oninput="search=this.value;renderPlayers()"><span class="badge">${state.players.length} giocatori</span></div><div id="player-grid" class="grid">${playerCards(list)}</div>`}
function playerCards(list){return list.map(x=>`<article class="card player" tabindex="0" role="button" aria-label="Apri profilo ${esc(x.name)}" onclick="profile(${x.id})" onkeydown="if(event.key==='Enter')profile(${x.id})">${avatar(x)}${canSee(x)?`<span class="overall">${overall(x)}</span>`:''}<h3>${esc(x.name)} ${x.id===user?'<span class="badge">Tu</span>':''}</h3><small class="muted">${esc(x.role)} ${x.admin?'· Admin':''} ${x.occasional?'· Occasionale':''}</small>${canSee(x)?radar(x)+`<div class="mini-stats"><div><b>${x.goals}</b><small>GOL</small></div><div><b>${x.apps}</b><small>PRESENZE</small></div><div><b>${x.own}</b><small>AUTOGOL</small></div></div>`:'<div class="notice">Statistiche riservate</div>'}</article>`).join('')||'<div class="empty">Nessun giocatore trovato.</div>'}
function renderPlayers(){$('#player-grid').innerHTML=playerCards(state.players.filter(x=>x.name.toLowerCase().includes(search.toLowerCase())))}
function matches(){return heading('Il calendario','Il prossimo fischio d’inizio e tutte le partite del gruppo.',admin()?'<button class="btn" onclick="newMatch()">＋ Nuova partita</button>':'')+state.matches.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).map(m=>`<article class="card match"><div class="row spread"><h3>${date(m.date)}</h3><span class="badge">${m.cancelled?'Annullata':m.done?'Conclusa':'In programma'}</span></div><div class="match-meta">${m.time} · ${esc(m.field)}</div><div class="row spread"><strong>Verdi <span class="score">${m.done?resultScore(m).join(' : '):'vs'}</span> Blu</strong><button class="btn small secondary" onclick="showMatch(${m.id})">Dettagli →</button></div></article>`).join('')}
function stats(){const visible=state.players.filter(canSee).sort((a,b)=>b[sort]-a[sort]);return heading('Numeri che contano','Gol, presenze e qualche deviazione nella porta sbagliata.')+(!admin()&&!me().seeAll?'<div class="notice">Puoi vedere le tue statistiche. L’accesso a quelle del gruppo è gestito dagli admin.</div>':'')+`<div class="toolbar"><select aria-label="Ordina classifica" onchange="sort=this.value;render()"><option value="goals" ${sort==='goals'?'selected':''}>Più gol</option><option value="apps" ${sort==='apps'?'selected':''}>Più presenze</option><option value="own" ${sort==='own'?'selected':''}>Più autogol</option></select></div><div class="card table-wrap"><table><thead><tr><th>#</th><th>Giocatore</th><th>Gol</th><th>Autogol</th><th>Presenze</th><th>Gol / partita</th></tr></thead><tbody>${visible.map((x,i)=>`<tr><td>${i+1}</td><td><button class="link row" onclick="profile(${x.id})">${avatar(x)} ${esc(x.name)}</button></td><td><b>${x.goals}</b></td><td>${x.own}</td><td>${x.apps}</td><td>${x.apps?(x.goals/x.apps).toFixed(2):'—'}</td></tr>`).join('')}</tbody></table></div>`}
function awards(){let full=admin()||me().seeAll;return heading('La bacheca dei premi','Stagione 2026 · La gloria dura un anno. Gli sfottò molto di più.')+`<div class="grid">${[['👟','Scarpa d’oro','Il maggior numero di gol','goals'],['🏆','Coppa Jumbo','Il maggior numero di autogol','own'],['🏅','Pollari','Il maggior numero di presenze','apps']].map(([icon,title,sub,key])=>{let max=Math.max(...state.players.map(x=>x[key])),w=state.players.filter(x=>x[key]===max);return `<div class="card"><div class="award-icon">${icon}</div><h2>${title}</h2><p class="muted">${sub}</p>${full?`<div class="award-number">${max} <small style="font-size:14px" class="muted">${key==='goals'?'gol':key==='own'?'autogol':'presenze'}</small></div><strong>${w.map(x=>esc(x.name)).join(' · ')}</strong><div class="progress"><i style="width:75%"></i></div><small class="muted">${w.length>1?'Primi a pari merito':'In testa alla classifica'} · premio a fine anno</small>`:'<div class="notice">Classifica riservata dal tuo admin.</div>'}</div>`}).join('')}${[['🌟','Pollone d’oro','Il miglior giocatore dell’anno.'],['🪣','Bidone d’oro','Il bidone dell’anno.']].map(([icon,t,s])=>`<div class="card"><div class="award-icon">${icon}</div><h2>${t}</h2><p class="muted">${s} Lo scegliete voi.</p><span class="badge">Voto segreto · autovoto consentito</span><p><button class="btn secondary" onclick="go('votes')">${state.votes[user]?'Voto inviato ✓':'Esprimi il tuo voto →'}</button></p></div>`).join('')}</div>`}
function votes(){let voted=!!state.votes[user];return heading('Il tuo voto fa la differenza','Due premi, una scheda. Puoi votare anche te stesso.')+`<div class="notice">🔒 Voto segreto: gli admin non vedono le scelte individuali. In questo prototipo la segretezza è simulata; i dati sono locali.</div>${voted?'<div class="card locked"><div class="award-icon" style="margin:0 auto 20px">✓</div><h2>Voto inviato</h2><p class="muted">La tua scheda è stata registrata. Un voto per premio, per stagione.</p></div>':!state.voteOpen?'<div class="card locked"><h2>Votazioni chiuse</h2><p class="muted">L’admin aprirà le votazioni per i premi annuali.</p></div>':`<form id="vote-form" onsubmit="submitVote(event)"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"><div class="card"><div class="award-icon">🌟</div><h2 class="vote-title">Pollone d’oro</h2><p class="muted">Chi ha fatto la differenza in campo?</p><div class="field"><label for="pollone">Il miglior giocatore</label><select id="pollone" required><option value="">Scegli un giocatore</option>${opts()}</select></div></div><div class="card"><div class="award-icon">🪣</div><h2 class="vote-title">Bidone d’oro</h2><p class="muted">Chi ci ha regalato gli errori memorabili?</p><div class="field"><label for="bidone">Il bidone dell’anno</label><select id="bidone" required><option value="">Scegli un giocatore</option>${opts()}</select></div></div></div><p><button class="btn">Invia voto segreto →</button></p></form>`}${admin()?`<div class="card" style="margin-top:20px"><div class="row spread"><div><h3>Gestione votazioni</h3><small class="muted">${Object.keys(state.votes).length} schede ricevute · ${state.voteOpen?'Votazione aperta':'Votazione chiusa'}</small></div><button class="btn secondary" onclick="state.voteOpen=!state.voteOpen;save();render()">${state.voteOpen?'Chiudi votazioni':'Riapri votazioni'}</button></div>${!state.voteOpen?voteResults():''}</div>`:''}`}
function voteResults(){return ['pollone','bidone'].map(key=>{let counts={};Object.values(state.votes).forEach(v=>counts[v[key]]=(counts[v[key]]||0)+1);return `<h3 style="margin-top:20px">${key==='pollone'?'Pollone':'Bidone'} d’oro · risultati aggregati</h3>${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([id,n])=>`<div class="row spread leader"><span>${esc(p(id).name)}</span><b>${n} ${n===1?'voto':'voti'}</b></div>`).join('')||'<p class="muted">Nessun voto ricevuto.</p>'}`}).join('')}
function settings(){if(!admin())return heading('I tuoi permessi','Il tuo profilo è sempre accessibile.')+`<div class="card"><h3>${me().seeAll?'Statistiche del gruppo visibili':'Solo le tue statistiche'}</h3><p class="muted">Gli admin gestiscono l’accesso alle statistiche e le valutazioni dei giocatori.</p></div>`;return heading('Gestione del gruppo','Decidi chi amministra e chi può vedere le statistiche di tutti.')+`<div class="notice">Ogni giocatore vede sempre le proprie statistiche. Gli admin possono gestire partite, esagoni e permessi.</div><div class="card table-wrap"><table><thead><tr><th>Giocatore</th><th>Admin</th><th>Statistiche di tutti</th></tr></thead><tbody>${state.players.map(x=>`<tr><td>${esc(x.name)}${x.id===user?' (tu)':''}</td><td><input type="checkbox" aria-label="Admin ${esc(x.name)}" ${x.admin?'checked':''} ${x.id===user?'disabled':''} onchange="permission(${x.id},'admin',this.checked)"></td><td><input type="checkbox" aria-label="Statistiche di tutti per ${esc(x.name)}" ${x.seeAll||x.admin?'checked':''} ${x.admin?'disabled':''} onchange="permission(${x.id},'seeAll',this.checked)"></td></tr>`).join('')}</tbody></table></div><div class="card" style="margin-top:20px"><h3>Notifiche simulate</h3>${state.notifications.slice().reverse().map(n=>`<div class="leader"><strong>${esc(n.text)}</strong><p class="muted" style="font-size:12px;margin-bottom:0">Destinatari: ${n.to.map(id=>esc(p(id).name)).join(', ')}</p></div>`).join('')||'<p class="muted">Crea una partita per simulare l’avviso ai 10 convocati.</p>'}</div>`}
const pages={home,players,matches,stats,awards,votes,settings};const navigation=[['home','⌂','Home'],['players','♟','Giocatori'],['matches','▦','Partite'],['stats','▥','Statistiche'],['awards','♜','Premi'],['votes','✓','Vota'],['settings','⚙','Gestione']];
function render(){$('#nav').innerHTML=navigation.map(([id,i,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span>${i}</span> ${t}</button>`).join('');if($('#identity'))$('#identity').innerHTML=state.players.filter(x=>!x.occasional).map(x=>`<option value="${x.id}" ${x.id===user?'selected':''}>${esc(x.name)} · ${x.admin?'Admin':'Giocatore'}</option>`).join('');$('#app').innerHTML=pages[page]()}
function go(id){page=id;search='';render();window.scrollTo(0,0)}$('#identity').onchange=e=>{user=+e.target.value;$('#modal').close();render()};
function modal(title,body){$('#modal').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="close" aria-label="Chiudi" onclick="document.querySelector('#modal').close()">×</button></div>${body}`;$('#modal').showModal()}
function profile(id){let x=p(id);modal(esc(x.name),`<div class="row">${avatar(x)}<div><strong>${esc(x.role)}</strong><p class="muted" style="margin:4px 0">${x.admin?'Admin':x.occasional?'Occasionale · senza account':'Giocatore'} · Stagione ${season}</p></div></div>${canSee(x)?radar(x)+`<div class="metrics" style="grid-template-columns:repeat(3,1fr)"><div class="metric"><small>GOL</small><strong>${x.goals}</strong></div><div class="metric"><small>AUTOGOL</small><strong>${x.own}</strong></div><div class="metric"><small>PRESENZE</small><strong>${x.apps}</strong></div></div>${admin()?`<button class="btn" onclick="editRatings(${id})">Modifica valutazioni</button>${id!==user?` <button class="btn secondary" onclick="deletePlayer(${id})">Elimina giocatore</button>`:''}`:'<p class="muted">Le valutazioni sono assegnate dagli admin.</p>'}`:'<div class="notice">Le statistiche di questo giocatore sono riservate.</div>'}`)}
function editRatings(id){if(!admin())return;let x=p(id);modal('Valutazioni · '+esc(x.name),`<form onsubmit="saveRatings(event,${id})">${labels.map((l,i)=>`<div class="rating-row"><label for="r${i}">${l}</label><input id="r${i}" type="range" min="1" max="99" value="${x.ratings[i]}" oninput="this.nextElementSibling.value=this.value"><output>${x.ratings[i]}</output></div>`).join('')}<div class="modal-actions"><button class="btn">Salva valutazioni</button></div></form>`)}
function saveRatings(e,id){e.preventDefault();if(!admin())return;p(id).ratings=labels.map((_,i)=>+$('#r'+i).value);save();$('#modal').close();render();toast('Valutazioni aggiornate')}
function addPlayer(){if(!admin())return;modal('Un nuovo compagno di squadra',`<form onsubmit="savePlayer(event)"><div class="field"><label for="new-name">Nome e cognome</label><input id="new-name" maxlength="60" required></div><div class="field"><label for="new-role">Ruolo</label><select id="new-role"><option>Attaccante</option><option>Regista</option><option>Difensore</option><option>Portiere</option></select></div><button class="btn">Aggiungi giocatore</button></form>`)}
function savePlayer(e){e.preventDefault();if(!admin())return;let name=$('#new-name').value.trim();if(!name)return;state.players.push({id:Math.max(...state.players.map(x=>x.id))+1,name,role:$('#new-role').value,admin:false,seeAll:false,goals:0,own:0,apps:0,ratings:[60,60,60,60,60,60]});save();$('#modal').close();render();toast('Giocatore aggiunto')}
function permission(id,key,value){if(!admin())return;p(id)[key]=value;save();render();toast('Permessi aggiornati')}
let draft=null;
function newMatch(){if(!admin())return;draft=null;modal('Organizza la prossima partita',`<form onsubmit="prepareTeams(event)"><div class="form-grid"><div class="field"><label for="match-date">Data</label><input id="match-date" type="date" value="${new Date().toLocaleDateString('sv-SE')}" required></div><div class="field"><label for="match-time">Ora</label><input id="match-time" type="time" value="21:00" required></div></div><div class="field"><label for="match-field">Campo</label><input id="match-field" value="Centro Sportivo Jumbo" required maxlength="100"></div><div class="row spread"><h3>Seleziona 10 partecipanti</h3><span id="selected-count" class="badge">0 / 10</span></div><div class="checklist">${state.players.map(x=>`<label class="check"><input type="checkbox" name="participant" value="${x.id}" onchange="countSelected()">${esc(x.name)}</label>`).join('')}</div><div class="modal-actions"><button class="btn" id="teams-next" disabled>Crea formazioni →</button></div></form>`)}
function countSelected(){let inputs=[...document.querySelectorAll('[name=participant]')],n=inputs.filter(x=>x.checked).length;$('#selected-count').textContent=n+' / 10';$('#teams-next').disabled=n!==10;inputs.forEach(x=>x.disabled=n===10&&!x.checked)}
function prepareTeams(e){e.preventDefault();if(!admin())return;const ids=[...document.querySelectorAll('[name=participant]:checked')].map(x=>+x.value);if(ids.length!==10)return;ids.sort((a,b)=>overall(p(b))-overall(p(a)));let a=[],b=[];ids.forEach((id,i)=>([0,3,4,7,8].includes(i)?a:b).push(id));draft={date:$('#match-date').value,time:$('#match-time').value,field:$('#match-field').value.trim(),a,b};teamEditor()}
function teamEditor(){modal('Due squadre, una sfida',`<p class="muted">Formazioni proposte in base al livello. Scambia i giocatori prima di confermare.</p><div class="teams">${['a','b'].map((t,i)=>`<div class="team ${i?'b':''}"><h3>${i?'Blu':'Verdi'} · ${Math.round(draft[t].reduce((s,id)=>s+overall(p(id)),0)/5)} OVR</h3>${draft[t].map(id=>`<div class="row spread leader"><small>${esc(p(id).name)}</small><button class="btn small secondary" onclick="swapPrompt(${id},'${t}')">⇄</button></div>`).join('')}</div>`).join('')}</div><div class="notice">${date(draft.date)} · ${draft.time}<br>${esc(draft.field)}<br>Verrà simulata una notifica ai 10 convocati.</div><div class="modal-actions"><button class="btn" onclick="confirmMatch()">Conferma e convoca</button></div>`)}
function swapPrompt(id,t){let other=t==='a'?'b':'a';modal('Scambia '+esc(p(id).name),`<p class="muted">Scegli un giocatore della squadra avversaria.</p>${draft[other].map(x=>`<button class="btn secondary" style="margin:5px" onclick="swapPlayers(${id},${x},'${t}')">${esc(p(x).name)}</button>`).join('')}<p><button class="link" onclick="teamEditor()">← Torna alle formazioni</button></p>`)}
function swapPlayers(id,id2,t){let other=t==='a'?'b':'a',i=draft[t].indexOf(id),j=draft[other].indexOf(id2);draft[t][i]=id2;draft[other][j]=id;teamEditor()}
function confirmMatch(){if(!admin()||!draft)return;let m={...draft,id:Date.now(),done:false};state.matches.push(m);state.notifications.push({text:`Convocazione: ${date(m.date)} alle ${m.time} · ${m.field}`,to:[...m.a,...m.b]});save();draft=null;$('#modal').close();page='matches';render();toast('Partita creata · 10 notifiche simulate')}
function resultScore(m){if(m.score)return m.score;let sum=(ids,k)=>ids.reduce((s,id)=>s+(m.result[id]?.[k]||0),0);return [sum(m.a,'goals')+sum(m.b,'own'),sum(m.b,'goals')+sum(m.a,'own')]}
function showMatch(id){let m=state.matches.find(x=>x.id===id);modal(date(m.date),`<p class="muted">${m.time} · ${esc(m.field)}</p>${m.cancelled?`<div class="notice">Partita annullata. Non conta nelle statistiche.${m.cancellationReason?`<br>Motivo: ${esc(m.cancellationReason)}`:''}</div>`:''}<div style="background:var(--green);padding:15px;border-radius:12px">${pitch(m)}</div>${m.done?`<h2 style="text-align:center;margin:20px">Verdi ${resultScore(m).join(' : ')} Blu</h2>`:''}<div class="teams" style="margin-top:15px">${['a','b'].map((t,i)=>`<div class="team ${i?'b':''}"><h3>${i?'Blu':'Verdi'}</h3>${m[t].map(id=>`<p>${esc(p(id).name)} ${m.done&&m.result&&!m.result[id].present?'· assente':''}</p>`).join('')}</div>`).join('')}</div><div class="modal-actions">${!m.cancelled?`<button class="btn secondary" onclick="downloadCalendar(${id})">Calendario .ics</button>`:''}${admin()&&!m.cancelled?`<button class="btn" onclick="editResult(${id})">${m.done?'Correggi risultato':'Registra risultato'}</button><button class="btn secondary" onclick="cancelMatch(${id})">Annulla partita</button>`:''}</div>`)}
function editResult(id){if(!admin())return;let m=state.matches.find(x=>x.id===id);modal('Il tabellino della partita',`<p class="muted">Conferma le presenze e inserisci i gol. Gli autogol valgono per la squadra avversaria.</p><form onsubmit="saveResult(event,${id})"><div class="result-row"><b>Giocatore</b><small>Gol</small><small>Autogol</small><small>Pres.</small></div>${['a','b'].map((t,i)=>`<h3 style="margin-top:15px">${i?'Blu':'Verdi'}</h3>${m[t].map(id=>{let r=m.result?.[id]||{goals:0,own:0,present:true};return `<div class="result-row"><span style="font-size:12px">${esc(p(id).name)}</span><input aria-label="Gol ${esc(p(id).name)}" id="g${id}" type="number" min="0" max="99" required value="${r.goals}"><input aria-label="Autogol ${esc(p(id).name)}" id="o${id}" type="number" min="0" max="99" required value="${r.own}"><input aria-label="Presenza ${esc(p(id).name)}" id="p${id}" type="checkbox" ${r.present?'checked':''}></div>`}).join('')}`).join('')}<div class="notice">Le correzioni sostituiscono il vecchio tabellino: gol e presenze non vengono contati due volte.</div><button class="btn">Salva e aggiorna statistiche</button></form>`)}
function saveResult(e,id){e.preventDefault();if(!admin())return;let m=state.matches.find(x=>x.id===id),next={};for(let pid of [...m.a,...m.b]){let r={goals:+$('#g'+pid).value,own:+$('#o'+pid).value,present:$('#p'+pid).checked};if(!Number.isInteger(r.goals)||!Number.isInteger(r.own)||r.goals<0||r.own<0||r.goals>99||r.own>99){toast('Inserisci numeri interi da 0 a 99');return}if(!r.present&&(r.goals||r.own)){toast('Un assente non può avere gol o autogol');return}next[pid]=r}for(let pid of [...m.a,...m.b]){let x=p(pid),prev=m.result?.[pid]||{goals:0,own:0,present:false},r=next[pid];x.goals+=r.goals-prev.goals;x.own+=r.own-prev.own;x.apps+=Number(r.present)-Number(prev.present)}m.result=next;m.done=true;save();$('#modal').close();render();toast('Risultato salvato · statistiche aggiornate')}
function submitVote(e){e.preventDefault();if(state.votes[user]||!state.voteOpen)return;let a=$('#pollone').value,b=$('#bidone').value;if(a===''||b==='')return;state.votes[user]={pollone:+a,bidone:+b};save();render();toast('Scheda inviata. Grazie per il tuo voto!')}
function downloadCalendar(id){let m=state.matches.find(x=>x.id===id),d=m.date.replaceAll('-','')+'T'+m.time.replace(':','')+'00',end=new Date(m.date+'T'+m.time+':00');end.setMinutes(end.getMinutes()+60);let endstr=end.getFullYear()+String(end.getMonth()+1).padStart(2,'0')+String(end.getDate()).padStart(2,'0')+'T'+String(end.getHours()).padStart(2,'0')+String(end.getMinutes()).padStart(2,'0')+'00',icsEscape=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const blob=new Blob([['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ChickenFutsal//IT','BEGIN:VEVENT',`UID:${m.id}@chicken-futsal`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}`,`DTSTART;TZID=Europe/Rome:${d}`,`DTEND;TZID=Europe/Rome:${endstr}`,'SUMMARY:Calcetto - ChickenFutsal',`LOCATION:${icsEscape(m.field)}`,'END:VEVENT','END:VCALENDAR'].join('\r\n')],{type:'text/calendar;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='calcetto.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Evento calendario scaricato')}
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}});render();
</script><script src="/cloud.js"></script></body></html>
